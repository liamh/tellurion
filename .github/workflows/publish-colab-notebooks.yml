      - name: Publish notebooks to colab-notebooks branch
        run: |
          set -euo pipefail

          # Copy generated notebooks to a dedicated publish directory
          rm -rf colab-export
          mkdir -p colab-export
          cp docs/source/tutorials/*.ipynb colab-export/

          # Commit only the export directory contents to colab-notebooks branch root
          # via subtree split (clean and reliable)
          git add colab-export/*.ipynb
          if git diff --cached --quiet; then
            echo "No notebook changes to publish."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Create a synthetic commit in current branch with export content
          git commit -m "Prepare Colab notebooks for publish"

          # Split export dir to a temporary branch
          git subtree split --prefix colab-export -b colab-publish-branch

          # Force-push split branch to colab-notebooks (branch root contains only notebooks)
          git push --force origin colab-publish-branch:colab-notebooks

          # Clean temp branch
          git branch -D colab-publish-branch
[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tellurion"
version = "0.1.0"
description = "Astrodynamics and satellite navigation using Orekit and AstroPy"
authors = [{name = "Liam Healy"}]
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}

# Core package dependencies
dependencies = [
    "astropy>=7.0",
    "numpy>=1.20",
    "jdk4py",
    "orekit-jpype",
    "git+https://gitlab.orekit.org/orekit/orekit-data.git",
    "funcy",
    "pandas",
    "spacetrack",
    "geocoder",
    "munch" # for demos
]

[project.optional-dependencies]
# Documentation dependencies
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme",
    "sphinx-automodapi",
    "sphinx-astropy",
    "numpydoc",
    "nbsphinx",
    "nbsphinx-link",
    "jupyter",
    "jupyterlab",
    "ipython",
    "ipykernel",
]

# Development dependencies
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "black",
    "flake8",
]

# All optional dependencies combined
all = [
    "tellurion[docs,dev]",
]

[project.urls]
Homepage = "none" # https://github.com/liamh/tellurion
Documentation = "none" # "https://github.com/liamh/tellurion"
Repository = "none" # "https://github.com/liamh/tellurion"
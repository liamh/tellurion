[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tellurion"
version = "0.1.0"
description = "Astrodynamics and satellite navigation using Orekit and AstroPy"
authors = [{name = "Liam Healy"}]
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE.txt"]
# Classifiers help PyPI index and search your license correctly
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education"
    ]

# Core package dependencies
dependencies = [
    "astropy>=8.0",
    "numpy>=1.20",
    "jdk4py",
    "orekit-jpype",
    "funcy",
    "pandas",
    "spacetrack",
    "geocoder",
    "munch",  # for demos
]


[project.optional-dependencies]
# HDF5 serialization support
hdf5 = [
    "astropy-hdf5io>=0.1.0",
]


# Documentation dependencies
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme",
    "sphinx-automodapi",
    "sphinx-astropy",
    "numpydoc",
    "nbsphinx",
    "nbsphinx-link",
    "jupyter",
    "jupyterlab",
    "ipython",
    "ipykernel",
]

# Development dependencies (includes hdf5 so tests can cover it)
dev = [
    "tellurion[hdf5]",
    "pytest>=7.0",
    "pytest-cov",
    "black",
    "flake8",
]

# All optional dependencies combined
all = [
    "tellurion[hdf5,docs,dev]",
]
data = [
    "orekitdata @ git+https://gitlab.orekit.org/orekit/orekit-data.git",
]

[project.urls]
Homepage = "https://github.com/liamh/tellurion"
Repository = "https://github.com/liamh/tellurion"
Documentation = "https://tellurion.readthedocs.io"

[tool.setuptools.packages.find]
where = ["."]
include = ["tellurion*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "hdf5: tests requiring astropy-hdf5io (deselect with '-m not hdf5')",
]

# Check/fix formatting and style for a single file
#  ruff check --fix tellurion/ork/prop.py && ruff format tellurion/ork/prop.py
# For all files
#  ruff check --fix --unsafe-fixes . && ruff format .
[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "F",    # Pyflakes
  "Q",    # Quote style
  "W291", # Trailing whitespace
  "W293", # Blank line whitespace
  "D300", # Enforce PEP 257 triple-double quotes (""")
  "I",    # isort (automatically formats import lines)
]

# Pass rule codes as an array (sequence) rather than a table/map
extend-safe-fixes = ["W293", "W291"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.format]
docstring-code-format = true
